name: arrakis

services:
  workspace:
    image: lisanalgaib:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sietch-tabr
    hostname: tabr
    init: true
    tty: true
    stdin_open: true
    user: fremen
    working_dir: /home/fremen
    environment:
      HOME: /home/fremen
      USER: fremen
      LOGNAME: fremen
      TERM: xterm-256color
      COLORTERM: truecolor
      LISAN_CONTAINER: "1"
    command: ["sleep", "infinity"]
    labels:
      io.lisanalgaib.workspace: "1"
    privileged: false
    volumes:
      - usul:/home/fremen
      - type: bind
        source: ${LISAN_SHARED_DIR:-./shared}
        target: /home/fremen/shared
        bind:
          create_host_path: false

volumes:
  usul:
    name: arrakis-usul
    labels:
      io.lisanalgaib.volume: "1"

networks:
  default:
    name: arrakis-shield-wall
    labels:
      io.lisanalgaib.network: "1"
